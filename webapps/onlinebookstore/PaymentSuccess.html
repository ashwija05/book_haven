<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BookHaven</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<header>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="margin-bottom:0px;">

	<!-- Logo + Website Name (LEFT) -->
	<a class="navbar-brand d-flex align-items-center" href="CustomerHome.html">
		<img src="images/BookHaven-logo.png" width="60" height="30" alt="BookHaven Logo">
		<span style="
			color:#f4b400;
			font-size:24px;
			font-weight:bold;
			margin-left:8px;
		">
			BookHaven
		</span>
	</a>

	<button class="navbar-toggler" type="button" data-toggle="collapse"
		data-target="#navbarNav" aria-controls="navbarNav"
		aria-expanded="false" aria-label="Toggle navigation">
		<span class="navbar-toggler-icon"></span>
	</button>

	<!-- Menu RIGHT -->
	<div class="collapse navbar-collapse" id="navbarNav">
		<ul class="navbar-nav ml-auto">
			<li class="nav-item">
				<a class="nav-link active" href="CustomerHome.html" id="home">Home</a>
			</li>
			<li class="nav-item">
				<a class="nav-link" href="viewbook" id="books">Available Books</a>
			</li>
			<li class="nav-item">
				<a class="nav-link" href="cart" id="cart">Cart</a>
			</li>
			<li class="nav-item">
				<a class="nav-link" href="logout" id="logout">Logout</a>
			</li>
		</ul>
	</div>

</nav>
</header>

<div class="container mt-5 text-center">
  <div class="card p-5 shadow">

    <h2 class="text-success" id="statusTitle"></h2>
	<h4 id="statusMessage"></h4>

    <p class="mt-3">Thank you for shopping with BookHaven.</p>

    <a href="CustomerHome.html" class="btn btn-primary mt-3">
      Continue Shopping
    </a>

  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const method = params.get("method");

  if(method === "cod"){
      document.getElementById("statusTitle").innerHTML = "✔ Order Placed Successfully";
      document.getElementById("statusMessage").innerHTML = 
          "Your order has been placed with Cash on Delivery.";
  } else {
      document.getElementById("statusTitle").innerHTML = "✔ Payment Successful";
      document.getElementById("statusMessage").innerHTML = 
          "Your order has been placed!";
  }
</script>

</body>
</html>
