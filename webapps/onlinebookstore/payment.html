<html>
<head>
<meta charset="ISO-8859-1">

<link rel="icon" type="image/png" sizes="16x16" href="./favicons/favicon-16x16.png">
<link rel="manifest" href="./favicons/site.webmanifest">

</script>
	
</script>
<link rel="stylesheet" href="styles.css">
<style>
.row {
	display: -ms-flexbox; /* IE10 */
	display: flex;
	-ms-flex-wrap: wrap; /* IE10 */
	flex-wrap: wrap;
	margin: 0 -16px;
}

.col-25 {
	-ms-flex: 25%; /* IE10 */
	flex: 25%;
}

.col-50 {
	-ms-flex: 50%; /* IE10 */
	flex: 50%;
}

.col-75 {
	-ms-flex: 75%; /* IE10 */
	flex: 75%;
}

.col-25, .col-50, .col-75 {
	padding: 0 16px;
}

.container {
	background-color: #f2f2f2;
	padding: 5px 20px 15px 20px;
	border: 1px solid lightgrey;
	border-radius: 3px;
}

input[type=text] {
	width: 100%;
	margin-bottom: 20px;
	padding: 12px;
	border: 1px solid #ccc;
	border-radius: 3px;
}

label {
	margin-bottom: 10px;
	display: block;
}

.icon-container {
	margin-bottom: 20px;
	padding: 7px 0;
	font-size: 24px;
}

.btn {
	background-color: #04AA6D;
	color: white;
	padding: 12px;
	margin: 10px 0;
	border: none;
	width: 100%;
	border-radius: 3px;
	cursor: pointer;
	font-size: 17px;
}

.btn:hover {
	background-color: #45a049;
}

span.price {
	float: right;
	color: grey;
}

/* Responsive layout - when the screen is less than 800px wide, make the two columns stack on top of each other instead of next to each other (and change the direction - make the "cart" column go on top) */
@media ( max-width : 800px) {
	.row {
		flex-direction: column-reverse;
	}
	.col-25 {
		margin-bottom: 20px;
	}
}
</style>
</head>
<body>
	<header>
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
			<a class="navbar-brand d-flex align-items-center" href="CustomerHome.html">
    		<img src="images/BookHaven-logo.png" width="50" height="30">
    		<span class="ml-2 font-weight-bold text-warning">BookHaven</span>
  			</a>

			<button style="background-color: white;" class="navbar-toggler"
				type="button" data-toggle="collapse" data-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">
    		<ul class="navbar-nav ml-auto">
      		<li class="nav-item"><a class="nav-link" href="CustomerHome.html">Home</a></li>
      		<li class="nav-item"><a class="nav-link" href="viewbook">Available Books</a></li>
      		<li class="nav-item active"><a class="nav-link" href="cart">Cart</a></li>
      		<li class="nav-item"><a class="nav-link" href="logout">Logout</a></li>
				</ul>
			</div>
		</nav>
	</header>
	<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/popper.js@1.14.6/dist/umd/popper.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@4.2.1/dist/js/bootstrap.min.js"></script>
	<div class="container">
	 <div id='topmid' style='background-color:grey'>Cart Checkout</div>
		<div class="row">
			<div class="col-75">
				<div class="container">
					<form action="pay" method="post">
						<div class="row">
							<div class="col-50">
								<h3>Billing Address</h3>
								<label for="fname"><i class="fa fa-user"></i> Full Name</label>
								<input type="text" id="fname" name="firstname" placeholder="John M" pattern="[A-Za-z ]{3,}"> 
								<label for="email"><i class="fa fa-envelope"></i> Email</label> 
								<input type="text" id="email" name="email" placeholder="john@example.com" required> 
								<label for="adr"><i class="fa fa-address-card-o"></i> Address</label>
								<input type="text" id="adr" name="address" placeholder="542 W. 15th Street" required> 
								<label for="city"><i class="fa fa-institution"></i> City</label> 
								<input type="text" id="city" name="city" placeholder="New York" required
           pattern="[A-Za-z ]+" >

								<div class="row">
									<div class="col-50">
										<label for="state">State</label> 
										<input type="text" id="state" name="state" placeholder="State" required
               pattern="[A-Za-z]{2,25}">
									</div>
									<div class="col-50">
										<label for="zip">Zip</label> <input type="text" id="zip"
											name="zip" placeholder="575000" required
               pattern="[0-9]{5,6}">
									</div>
								</div>
							</div>

							<div class="col-50">
								<h3>Payment</h3>
								<label>Payment Method</label>
							<input type="radio" name="paymentMethod" value="card" checked> Credit / Debit Card
							<br>
							<input type="radio" name="paymentMethod" value="cod"> Cash on Delivery
							<br><br>
								<label for="fname">Accepted Cards Details:</label>
								<div class="icon-container">
									<i class="fa fa-cc-visa" style="color: navy;"></i> <i
										class="fa fa-cc-amex" style="color: blue;"></i> <i
										class="fa fa-cc-mastercard" style="color: red;"></i> <i
										class="fa fa-cc-discover" style="color: orange;"></i>
								</div>
								<label for="cname">Name on Card</label> 
								<input type="text" id="cname" name="cardname" placeholder="John M"  required pattern="[A-Za-z ]+">
								<label for="ccnum">Credit card number</label> 
								<input type="text" id="ccnum" name="cardnumber" placeholder="1111-2222-3333-4444" required pattern="[0-9]{16}"> 
								<label for="expmonth">Exp Month</label> 
								<input type="text" id="expmonth" name="expmonth" placeholder="September" required pattern="[A-Za-z]+">

								<div class="row">
									<div class="col-50">
										<label for="expyear">Exp Year</label> <input type="text" id="expyear" name="expyear" placeholder="2035" required pattern="[0-9]{4}">
									</div>
									<div class="col-50">
										<label for="cvv">CVV</label> <input type="text" id="cvv" name="cvv" placeholder="352" required pattern="[0-9]{3}">
									</div>
								</div>
							</div>

						</div>
						<label> <input type="checkbox" checked="checked"
							name="sameadr"> Shipping address same as billing
						</label>	
		<script>
function handlePayment(event){
    let method = document.querySelector('input[name="paymentMethod"]:checked').value;
    
    if(method === "cod"){
        event.preventDefault();

        // Collect address fields
        let name = document.getElementById("fname").value;
        let address = document.getElementById("adr").value;
        let city = document.getElementById("city").value;
        let state = document.getElementById("state").value;
        let zip = document.getElementById("zip").value;

        let fullAddress =
            "<b>Name:</b> " + name + "<br>" +
            "<b>Address:</b> " + address + "<br>" +
            "<b>City:</b> " + city + "<br>" +
            "<b>State:</b> " + state + "<br>" +
            "<b>Zip:</b> " + zip + "<br><br>" +
            "Confirm this delivery address?";

        document.getElementById("addressDetails").innerHTML = fullAddress;

        // Show Bootstrap modal
        $('#addressModal').modal('show');
    }
}

// Called when Confirm button in modal is clicked
function confirmCOD(){
    $('#addressModal').modal('hide');
    window.location.href = "PaymentSuccess.html?method=cod";
}
</script>
<!-- Address Confirmation Modal -->
<div class="modal fade" id="addressModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      
      <div class="modal-header">
        <h5 class="modal-title">Billing Address</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>

      <div class="modal-body" id="addressDetails"></div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" onclick="confirmCOD()">Confirm</button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
