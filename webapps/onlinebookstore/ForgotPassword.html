<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BookHaven</title>

<link rel="stylesheet"
 href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">

<style>
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8f9fa;
}
.card {
    width: 400px;
    padding: 25px;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="card shadow">
    <h4 class="text-center mb-3">Forgot Password</h4>

    <div id="msg" class="alert text-center" style="display:none;"></div>

    <!-- STEP 1 : ENTER EMAIL -->
    <form id="emailForm" action="forgotPassword" method="post">
        <input type="hidden" name="step" value="email">

        <input type="email" name="email" class="form-control mb-3"
               placeholder="Enter registered email" required>

        <button type="submit" class="btn btn-primary btn-block">
            Next
        </button>
    </form>

    <!-- STEP 2 : NEW PASSWORD -->
    <form id="resetForm" action="forgotPassword" method="post" style="display:none;">
        <input type="hidden" name="step" value="reset">
        <input type="hidden" name="email" id="hiddenEmail">

        <input type="password" name="newpass" class="form-control mb-3"
               placeholder="New Password" required>

        <input type="password" name="confirmpass" class="form-control mb-3"
               placeholder="Confirm New Password" required>

        <button type="submit" class="btn btn-primary btn-block">
            Reset Password
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="CustomerLogin.html">Back to Login</a>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const msg = document.getElementById("msg");

const emailForm = document.getElementById("emailForm");
const resetForm = document.getElementById("resetForm");
const hiddenEmail = document.getElementById("hiddenEmail");

/* If email verified → show password form */
if (params.get("step") === "reset") {
    emailForm.style.display = "none";
    resetForm.style.display = "block";
    hiddenEmail.value = params.get("email");
}

/* Messages */
if (params.get("status") === "emailError") {
    msg.className = "alert alert-danger";
    msg.innerText = "Email not registered!";
    msg.style.display = "block";
}

if (params.get("status") === "passError") {
    msg.className = "alert alert-danger";
    msg.innerText = "Passwords do not match!";
    msg.style.display = "block";
}

if (params.get("status") === "success") {
    msg.className = "alert alert-success";
    msg.innerText = "Password reset successful! Please login.";
    msg.style.display = "block";
}
</script>

</body>
</html>
